name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux-static:
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cross
        run: cargo install cross --locked
      - name: Build static binary
        run: cross build --locked --release --target "${{ matrix.target }}"
      - name: Package
        run: |
          install -d dist
          cp "target/${{ matrix.target }}/release/hostknot" dist/hostknot
          tar -C dist -czf "hostknot-${{ github.ref_name }}-${{ matrix.target }}.tar.gz" hostknot
          sha256sum "hostknot-${{ github.ref_name }}-${{ matrix.target }}.tar.gz" > "hostknot-${{ github.ref_name }}-${{ matrix.target }}.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            *.tar.gz
            *.sha256

  publish:
    needs: linux-static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Create aggregate checksums
        run: cat artifacts/*.sha256 > artifacts/SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/SHA256SUMS
